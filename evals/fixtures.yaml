# Synthetic fixture documents for the evaluation suite. No real customer,
# person or organisation data. Names are invented.

policies:
  leave-policy.md: |
    # Annual leave policy
    ## Entitlement
    Full-time staff receive 27 days of annual leave plus public holidays.
    Part-time staff receive a pro-rata entitlement.
    ## Carry over
    Up to 5 unused days may be carried into the next leave year. Carried days expire on 31 March.
    ## Booking
    Book leave at least two weeks in advance through the HR portal.
  travel-policy.md: |
    # Travel policy
    ## Rail
    Standard class rail is the default. First class needs director approval.
    ## Hotels
    The nightly hotel limit is 140 pounds in London and 110 pounds elsewhere.
    ## Mileage
    Private car mileage is reimbursed at 45 pence per mile for the first 10,000 miles.
  expenses-policy.md: |
    # Expenses policy
    ## Deadlines
    Submit expense claims within 60 days of the expense date.
    ## Receipts
    Itemised receipts are required for every claim over 25 pounds.
    ## Subsistence
    The daily subsistence limit is 35 pounds when travelling overnight.
  security-policy.md: |
    # Information security policy
    ## Passwords
    Passwords must be at least 14 characters. Use the approved password manager.
    ## Devices
    Laptops must have disk encryption enabled. Report a lost device within 24 hours.
    ## Classification
    Most working documents are OFFICIAL. Do not process anything above OFFICIAL on personal devices.
  it-support.md: |
    # IT support
    ## Contact
    Raise IT incidents through the service desk portal. Priority 1 incidents are answered within 30 minutes.
    ## Hours
    The service desk is staffed from 07:00 to 19:00 on weekdays.

