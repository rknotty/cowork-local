[project]
name = "local-cowork"
version = "0.1.0"
description = "Local agent harness on Foundry Local. Proof of concept, single user, single device."
requires-python = ">=3.11"
dependencies = [
    "openai",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyyaml",
    "jsonschema",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.ruff]
line-length = 88
target-version = "py311"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["orchestrator/tests"]
asyncio_mode = "auto"
